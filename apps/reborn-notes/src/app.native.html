<!doctype html>
<!--
  Native (Capacitor) template - app.html adapted for the static build + hash CSP:
  - CSP nonce attributes removed (a prerendered SPA fallback cannot fill a
    per-request nonce). Native CSP is hash-based: SvelteKit hashes its own
    bootstrap script; the inline <style> below is covered by style-src 'unsafe-inline'.
  - The web/PWA-only inline scripts (theme-flash, offline/SW detection) are DROPPED:
    SvelteKit does not hash template inline scripts, so under hash CSP they would be
    blocked; and offline/SW detection is moot under Capacitor (no service worker,
    assets are local). Trade-off: a brief theme FOUC on cold start for dark-mode
    users (the app applies the theme on mount). Refine later with an external
    'self' theme-init script if needed.
  - No web manifest link (served by a +server.ts route absent from the static bundle).
  (Do NOT write the literal nonce placeholder token in this comment - the prerender
  check scans the whole template, comments included, and would re-trip.)
  Selected via kit.files.appTemplate when BUILD_TARGET=native. KNOWN DRIFT RISK:
  keep in sync with app.html until a build step generates it (Faza 1 task 8).
-->
<html lang="%lang%" data-sveltekit-template>
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2026-04-26" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FFD43B" />
		<title>re/notes</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="re/notes" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png?v=2026-04-26" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-loading">
			<div class="app-loading__inner">
				<div class="app-loading__spinner"></div>
				<p>%init_loading_msg%</p>
			</div>
		</div>
		<style>
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
			#app-loading {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f9fafb;
				color: #6b7280;
				font-family: system-ui;
			}
			#app-loading .app-loading__inner {
				text-align: center;
			}
			#app-loading .app-loading__spinner {
				width: 32px;
				height: 32px;
				margin: 0 auto 16px;
				border: 3px solid #e5e7eb;
				border-top-color: #fbc02d;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			.dark #app-loading {
				background: #252525;
				color: #a3a3a3;
			}
			.dark #app-loading .app-loading__spinner {
				border-color: #404040;
				border-top-color: #fbc02d;
			}
			/* Hide loading indicator when app is ready */
			body:has(.svelte-app-ready) #app-loading {
				display: none !important;
			}
		</style>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
