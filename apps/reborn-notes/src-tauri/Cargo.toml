[package]
name = "reborn-notes-desktop"
version = "0.0.1"
description = "re/notes desktop shell (Tauri 2) - D0 spike"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "reborn_notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# HTTP transport for the remote API (the webview is cross-origin to it and the
# server sends no CORS headers - same role as CapacitorHttp on mobile).
# Default features are off on purpose: the default `cookies` feature keeps a
# cookie jar and writes it to a plaintext `.cookies` file in the app cache
# directory. Native auth is token-based, so no cookie may be stored at all.
tauri-plugin-http = { version = "2", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
] }
# OS credential store (macOS Keychain, Windows Credential Manager) for the
# refresh token and the master key. Pinned to 3.x: 4.x moved to a different
# crate layout.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
