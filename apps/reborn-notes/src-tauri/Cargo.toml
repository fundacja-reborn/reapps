[package]
name = "reborn-notes-desktop"
version = "0.0.1"
description = "re/notes desktop shell (Tauri 2)"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "reborn_notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Mock runtime for the IPC permission tests (src/capability_tests.rs). Dev
# dependency features apply to test builds only; no new crate in the lockfile.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
# HTTP transport for the remote API (the webview is cross-origin to it and the
# server sends no CORS headers - same role as CapacitorHttp on mobile).
# Default features are off on purpose: the default `cookies` feature keeps a
# cookie jar and writes it to a plaintext `.cookies` file in the app cache
# directory. Native auth is token-based, so no cookie may be stored at all.
tauri-plugin-http = { version = "2", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
] }
# System folder dialog for linking a folder (folder sync, automated backup).
# Only its Rust API is used; the webview gets no dialog permission.
tauri-plugin-dialog = "2"
# Window size, position and maximized state across launches. Only its Rust
# side is used; the webview gets no window-state permission.
tauri-plugin-window-state = "2"
# Folder grants: the token -> folder registry kept on the Rust side.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Export payloads arrive from the webview as base64.
base64 = "0.22"

# Refresh token and master key on Windows: Credential Manager (D5). Pinned to
# 3.x: 4.x moved to a different crate layout. macOS uses its own keychain code
# (secure_storage.rs, below).
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# App Lock on macOS: LocalAuthentication (Touch ID, account password). The
# objc2 crates are the bindings Tauri itself already builds on, so only the
# LocalAuthentication one is new to the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-local-authentication = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "LABiometryType",
  "LAContext",
  "LAError",
] }
objc2 = "0.6"
# NSBundle: build number (app_info). NSFileManager, NSURL and NSValue: the
# Time Machine exclusion of the webview's data (backup_exclusion). NSData and
# the bookmark options (bitflags): security-scoped bookmarks of linked folders
# (folder_fs).
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "bitflags",
  "NSArray",
  "NSBundle",
  "NSData",
  "NSError",
  "NSFileManager",
  "NSPathUtilities",
  "NSString",
  "NSURL",
  "NSValue",
] }
block2 = "0.6"
# External links (external_links.rs): NSWorkspace opens them in the default
# app. Same objc2 family; already in the lockfile (Tauri's window code).
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWorkspace",
] }
# Refresh token and master key on macOS: the data protection keychain, items
# of this Mac only (secure_storage.rs). Both crates were already in the
# lockfile (security-framework, rustls).
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }
core-foundation = "0.10"
# Overdue-backup reminder (backup_reminder): UNUserNotificationCenter. Same
# objc2 family; the crate was already in the lockfile (objc2-ui-kit, iOS).
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "bitflags",
  "UNUserNotificationCenter",
  "UNNotificationSettings",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationTrigger",
] }
