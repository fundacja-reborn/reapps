name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # Dummy DATABASE_URL for prisma generate during postinstall
      # (no actual DB connection needed — only schema parsing)
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      # Public env vars needed by SvelteKit $env/static/public
      # (not secrets — deployment base path and site URL)
      PUBLIC_BASE_PATH: ''
      PUBLIC_SITE_URL: 'http://localhost:4300'
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      # Setup pnpm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false

      # Setup Node.js with pnpm cache
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      # Install dependencies
      - run: pnpm install --frozen-lockfile

      # Security audit [SC1] — detect known CVEs in dependencies
      # Currently informational (|| true) because transitive deps (nx, svelte-kit,
      # sveltekit-superforms) have unresolved CVEs outside our control.
      # TODO: switch to hard fail once upstream packages patch their CVEs
      - name: Security audit
        run: |
          echo "=== Production dependencies ==="
          pnpm audit --audit-level moderate --prod || true
          echo ""
          echo "=== All dependencies ==="
          pnpm audit --audit-level high || true

      # SvelteKit sync — generate .svelte-kit/ directories
      # (required for build, test, and check targets — provides tsconfig, typed routes, $env modules)
      - name: SvelteKit sync
        run: |
          cd apps/reborn-task && npx svelte-kit sync
          cd ../../apps/reborn-notes && npx svelte-kit sync

      # Setup Nx SHAs for affected commands
      - uses: nrwl/nx-set-shas@v5

      # Run affected check (svelte-check), tests and build
      # Note: removed 'lint' as it's not configured in the project
      # Targets are run in separate steps (not `-t check test build`) so that
      # check/test/build for the same project don't run in parallel — all three
      # invoke `svelte-kit sync` (directly or via the Vite plugin) and writing
      # to `.svelte-kit/types/` concurrently caused intermittent ENOENT races.
      - run: pnpm nx affected -t check
      - run: pnpm nx affected -t test
      - run: pnpm nx affected -t build
