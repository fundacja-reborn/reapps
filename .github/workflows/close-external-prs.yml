name: Close External Pull Requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Close PR and leave comment
        uses: actions/github-script@v9
        with:
          script: |
            const message = [
              'Thank you for your interest in Reborn Apps! 🙏',
              '',
              'Due to the security-sensitive nature of this project (E2E encryption, Zero Knowledge architecture), **we do not accept external pull requests**. Every code change undergoes internal security review to protect the integrity of the encryption layer.',
              '',
              'We value your input — here's how you can contribute:',
              '',
              '- **Report a bug** — [open an Issue](https://github.com/fundacja-reborn/reapps/issues)',
              '- **Suggest a feature or discuss an idea** — [start a Discussion](https://github.com/fundacja-reborn/reapps/discussions)',
              '- **Report a security vulnerability** — see our [Security Policy](https://github.com/fundacja-reborn/reapps/blob/main/SECURITY.md)',
              '',
              'If you\'ve found a bug and know the fix, please describe it in an Issue — we\'ll gladly credit you.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed',
            });
