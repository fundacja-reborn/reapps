packages:
  - apps/*
  - packages/*
overrides:
  axios: 1.16.1
  follow-redirects: 1.16.0
  fast-uri: 3.1.2
  '@babel/plugin-transform-modules-systemjs': 7.29.7
  hono: 4.12.25
  cookie: 0.7.2
  esbuild: 0.28.1
  '@hono/node-server': 1.19.14
  devalue: 5.8.1
  dompurify@<3.4.11: '3.4.11' # GHSA-cmwh-pvxp-8882 DOMPurify ALLOWED_ATTR pollution via setConfig - PROD bundle (notes direct + jspdf-transitive)
  tmp@<0.2.7: '0.2.7' # GHSA-7c78-jf6q-g5cm tmp path traversal via non-string template (nx-transitive, dev-only)
  form-data@<4.0.6: '4.0.6' # GHSA-hmw2-7cc7-3qxx form-data CRLF injection in multipart field names (nx-transitive, dev-only)
  joi: 18.2.1 # GHSA-q7cg-457f-vx79 nested-input RangeError; superforms optional peer, unused (we use the Zod adapter)
  # Dev-only transitive CVE pins (Storybook, nx http-server); absent from prod bundle
  ws: '8.21.0' # GHSA-58qx-3vcg-4xpx ws uninitialized memory disclosure
  qs: '6.15.2' # GHSA-q8mj-m7cp-5q26 qs.stringify DoS
  undici@<7.28.0: '7.28.0' # GHSA-vmh5-mc38-953g (high) + GHSA-pr7r-676h-xcf6 (moderate) undici, via vitest>jsdom (test-only)
auditConfig:
  ignoreGhsas:
    # esbuild Deno-loader RCE; unreachable here (Node-only toolchain). Remove
    # once the esbuild override above reaches >=0.28.1 (24h maturity gate).
    - GHSA-gv7w-rqvm-qjhr
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  nx: true
  prisma: true
  sharp: true
  svelte-preprocess: true
  core-js: false
  es5-ext: false
