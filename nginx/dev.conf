# Rate limiting zones for bot protection
limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=pow:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    proxy_connect_timeout 120s;

    # SvelteKit (adapter-node) wystawia w `Link:` header listę modulepreload/preload
    # hintów, która z rosnącym graphem chunków łatwo przekracza domyślny
    # `proxy_buffer_size` (4–8k zależnie od platformy) powodując 502 z błędem
    # "upstream sent too big header while reading response header from upstream".
    # Identyczny fix jak w nginx/staging.conf i nginx/prod.conf.
    proxy_buffer_size       16k;
    proxy_buffers           8  16k;
    proxy_busy_buffers_size 32k;

    # Root → redirect to Task app
    location = / {
        return 302 /task/;
    }

    # Favicon fallback → serve from Task app
    location = /favicon.svg {
        return 302 /task/favicon.svg;
    }

    # --- Rate-limited endpoints ---

    # Registration rate limiting (Task)
    location = /task/api/auth/register {
        limit_req zone=register burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:4200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # PoW challenge rate limiting (Task)
    location = /task/api/auth/pow {
        limit_req zone=pow burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:4200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Registration rate limiting (Notes)
    location = /notes/api/auth/register {
        limit_req zone=register burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://notes:4201;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # PoW challenge rate limiting (Notes)
    location = /notes/api/auth/pow {
        limit_req zone=pow burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://notes:4201;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- App proxies ---

    # Reborn Task → :4200
    location /task {
        proxy_pass         http://app:4200;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Reborn Notes → :4201
    location /notes {
        proxy_pass         http://notes:4201;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }
}
